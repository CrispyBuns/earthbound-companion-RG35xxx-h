name: Publish built platform packages
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful platform-preview build run ID
        required: true
        type: string
      release_tag:
        description: Existing draft platform release
        required: true
        type: string
      target:
        description: Package set to publish
        type: choice
        options: [all, android]
        default: all
permissions:
  actions: read
  contents: write
jobs:
  upload:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PACKAGE_TARGET: ${{ inputs.target }}
    steps:
      - name: Wait for completed builds and upload their packages
        shell: bash
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ports-preview\.[0-9]+$ ]]
          for attempt in $(seq 1 60); do
            status=$(gh run view "$BUILD_RUN" --json status --jq .status)
            if [ "$status" = completed ]; then
              [ "$(gh run view "$BUILD_RUN" --json conclusion --jq .conclusion)" = success ]
              break
            fi
            [ "$attempt" -lt 60 ]
            sleep 30
          done
          gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft | grep -qx true
          gh run download "$BUILD_RUN" -D packages -p 'EarthBound-Companion-*-preview'
          mapfile -d '' files < <(find packages -type f \( -name '*.tar.gz' -o -name '*.apk' \) -print0)
          if [ "$PACKAGE_TARGET" = android ]; then
            [ "${#files[@]}" -eq 2 ]
            for file in "${files[@]}"; do [[ "$file" = *.apk ]]; done
          else
            [ "${#files[@]}" -eq 5 ]
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}"
          python - "${files[@]}" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          repo, tag = os.environ['GH_REPO'], os.environ['RELEASE_TAG']
          release = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{repo}/releases/tags/{tag}']))
          assets = {entry['name']: entry for entry in release['assets']}
          for name in sys.argv[1:]:
              path = pathlib.Path(name)
              digest = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              asset = assets[path.name]
              if asset['size'] != path.stat().st_size or asset.get('digest') != digest:
                  raise SystemExit(f'Uploaded file differs: {path.name}')
              print(json.dumps(dict(name=path.name, size=asset['size'],
                                    digest=digest, serverDigestVerified=True)))
          PY
