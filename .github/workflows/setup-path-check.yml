name: Setup path checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'Companion/ReduxPackUpgrade.cs'
      - 'Ports/Tests/**'
      - '.github/workflows/setup-path-check.yml'
permissions:
  contents: read
jobs:
  path-check:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project Ports/Tests/Companion.Portable.Tests.csproj -c Release
